name: Build Nexa Launcher ARMv7 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Extract Nexa source archive
        run: unzip -q Nexa-Launcher.zip -d extracted
      - name: Build ARMv7 APK
        run: gradle -p extracted/Nexa-Launcher assembleDebug
      - name: Rename APK
        run: cp extracted/Nexa-Launcher/app/build/outputs/apk/debug/app-debug.apk Nexa-Launcher-ARMv7-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Launcher-ARMv7-debug
          path: Nexa-Launcher-ARMv7-debug.apk
          if-no-files-found: error
