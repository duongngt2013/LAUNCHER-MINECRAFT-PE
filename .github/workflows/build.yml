
name: Build NVMC Launcher APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Extract launcher source
        run: |
          mkdir extracted
          unzip -q NVMC-Launcher.zip -d extracted
          ls -la extracted/NVMC-Launcher

      - name: Build APK
        run: |
          gradle -p extracted/NVMC-Launcher assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NVMC-Launcher-APK
          path: extracted/NVMC-Launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
